name: "POTD waiter: post at 10:00 AM ET sharp"

# GitHub's scheduler fires cron hours late for this account — but workflow
# runs, once started, keep time perfectly. So this job starts in ANY of six
# hourly windows before the target, sleeps until exactly 14:00 UTC
# (10:00 AM ET during daylight time; bump to 15:00 after DST ends), then
# dispatches muse's posting workflow via the API — which fires instantly.
# muse's already-posted-today guard makes every duplicate firing a no-op.
# Public repo: sleeping runners cost nothing.
on:
  schedule:
    - cron: "30 8-13 * * *"
  workflow_dispatch: {}

# Only one waiter alive at a time: a later window replaces a sleeping one
# instead of joining it at 14:00 for a synchronized double-dispatch.
concurrency:
  group: potd-waiter
  cancel-in-progress: true

jobs:
  wait-and-fire:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Sleep until 14:00 UTC, then dispatch muse
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret not set — cannot dispatch."
            exit 1
          fi
          TARGET=$(date -u -d "today 14:00" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$((TARGET - NOW))
            echo "Sleeping $WAIT seconds until 14:00 UTC…"
            sleep "$WAIT"
          else
            echo "Past 14:00 UTC — dispatching immediately."
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jakeskind/muse/actions/workflows/potd-instagram.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch -> HTTP $code"
          if [ "$code" != "204" ]; then
            cat /tmp/resp.json
            exit 1
          fi
